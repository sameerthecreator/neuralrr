name: Build ReShade Addon

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Download ONNX Runtime
      run: |
        Invoke-WebRequest -Uri "https://github.com/microsoft/onnxruntime/releases/download/v1.16.1/onnxruntime-win-x64-1.16.1.zip" -OutFile "onnxruntime.zip"
        Expand-Archive -Path "onnxruntime.zip" -DestinationPath "."
        Rename-Item "onnxruntime-win-x64-1.16.1" "onnxruntime"

    - name: Compile DLL via Visual Studio MSBuild
      run: |
        # Create a basic Visual Studio console/DLL project build command via cl.exe
        # Or compile directly using Microsoft's native compiler command line tool:
        cmd.exe /c "\"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat\" x64 && cl.exe /LD main.cpp /I"." /I"reshade\include" /I"onnxruntime\include" onnxruntime\lib\onnxruntime.lib /Fe:neural_shader.dll"

    - name: Rename to addon64 and Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: neural-shader-addon
        path: |
          neural_shader.dll
          onnxruntime.dll
